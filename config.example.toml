# chekov machine config — copy to `config.toml` beside the binary root.
# Every key is optional; a missing file means all defaults. Unknown keys are
# rejected loudly. Tunables live here, never in code (§16.11).
#
# There is no built-in memory floor: `chekov run` judges each model's own
# footprint (weights + KV cache at its context) against the GPU budget this
# Mac reports, so a fresh install works the same on a 16 GB laptop and a
# 256 GB Studio. `wired_limit_mb` is an opt-in floor for a tuned machine —
# worked example, a 256 GB Mac running MiniMax-M2.7 UD-Q5_K_XL: 157.81 GiB
# of weights + 20.59 GiB q8_0 KV at 163840 ctx + ~2.6 GiB compute buffers =
# ~181 GiB wired, under macOS's 75%-of-RAM default (192 GiB), so 187000 MB
# is an honest floor there without a sysctl bump. Set it only if you want
# `run` to refuse below a number you chose; it prints the exact sysctl.

[server]
host = "127.0.0.1"
port = 8080
api_key = "chekov-local"

[limits]
# wired_limit_mb = 187000
hermes_ctx_floor = 65536

[doctor]
canary_max_tokens = 1500
degenerate_run_len = 30
replacement_char_max_pct = 5

[engine]                       # which llama.cpp `setup` / `update --engine` build
# git_ref = "b7000"            # branch, tag, or commit to pin to; absent = upstream HEAD
                               # of the day (fast-forward pull). Weights are revision-
                               # pinned; without this the binary that runs them is not.

[bench]                        # `chekov capability bench` sweep
depths = [1024, 4096, 16384]   # prompt depths (approx tokens)
repetitions = 5                # per depth; the first is dropped as warmup
max_tokens = 128               # decode length per probe
significance_pct = 5           # median delta below this: no significant difference
ready_max_polls = 600          # readiness budget: polls x interval
ready_interval_ms = 500
seed = 42                      # sampling seed pinned onto every probe
release_pct = 80               # teardown waits for this % of budget free
release_max_polls = 60         # release budget: polls x interval
release_interval_ms = 500
codebase_tasks = 24            # `--codebase` tasks per run (2/3 in_file, 1/3 function_body)
judge_max_tokens = 512         # --judge reply budget; 2x the largest reply in the 2026-08-30 probe
judge_min_consistency_pct = 70 # swap-agreement floor below which the equiv column is voided
judge_reasoning_effort = "low" # none|low|medium|high, forwarded to the judge's wire only

[tune]                         # `chekov tune` sweep
depth = 4096                   # probe prompt depth in tokens
flash_attn = ["on", "off"]                # stage fa: --flash-attn candidates
cache_types = ["q8_0", "f16"]             # stage kv: --cache-type-k/-v candidates
batch_sizes = [512, 1024, 2048, 4096]     # stage batch: --batch-size candidates
ubatch_sizes = [256, 512, 1024, 2048]     # stage ubatch: --ubatch-size candidates (<= incumbent batch)
