# §C.8 supply-chain gate, authored for CI use (`cargo deny check`).
# Not wired into `make lint` — the bootstrap prompt (§6) fixes lint to
# fmt + clippy; CI adds deny/audit per §C.13.

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    # File-level weak copyleft / permissive, pulled in transitively (colored,
    # option-ext, konst, webpki-roots). Fine for an MIT binary that does not
    # modify them.
    "MPL-2.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "deny"
# Explicit skips only (crate + reason) — never silently. Every entry below is
# a transitive duplicate inside the hf-hub → reqwest/tokio/windows tree that
# this crate cannot unify from its own manifest; revisit on each hf-hub bump.
skip = [
    { name = "base64" },
    { name = "cfg-if" },
    { name = "core-foundation" },
    { name = "getrandom" },
    { name = "syn" },
    { name = "wasi" },
    { name = "windows-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
