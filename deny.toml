# §C.8 supply-chain gate, authored for CI use (`cargo deny check`).
# Not wired into `make lint` — the bootstrap prompt (§6) fixes lint to
# fmt + clippy; CI adds deny/audit per §C.13.

# chekov is macOS / Apple Silicon only (AGENTS.md), so evaluate the graph for
# the target it actually ships for. Without this, Windows-only crates that are
# never compiled still count as duplicates and force skips that weaken the gate
# for every platform.
[graph]
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[advisories]
yanked = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    # File-level weak copyleft / permissive, pulled in transitively (colored,
    # option-ext, konst, webpki-roots). Fine for an MIT binary that does not
    # modify them.
    "MPL-2.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "deny"
# No skips. Every entry here used to be a transitive duplicate forced by the
# hf-hub → reqwest/tokio tree; with that gone the tree unifies on its own.
# Each was also unversioned, which disarmed duplicate detection for that crate
# at every version, forever — so an empty list is the stronger gate as well as
# the honest one.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
