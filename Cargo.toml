# chekov — local llama.cpp inference stack manager.
# Package is `chekov-mac` because crates.io `chekov` is taken (a CQRS/ES
# framework, 2019). The binary keeps the name `chekov` (bootstrap prompt §2.7).
# Published to crates.io by .github/workflows/release.yml on every `v*` tag.

[package]
name = "chekov-mac"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local llama.cpp inference stack manager for Apple Silicon: pull, run, doctor, update"
license = "MIT"
readme = "README.md"
repository = "https://github.com/acoletti/chekov"
keywords = ["llama-cpp", "llm", "cli", "metal", "gguf"]
categories = ["command-line-utilities"]
# Crate carries only what `cargo install` needs; CI and house-standards docs
# stay in the repo.
exclude = [".github/", "AGENTS.md", "clippy.toml", "deny.toml", "rustfmt.toml"]

[lib]
# Library target exists so tests/ can exercise modules directly; the binary
# stays a thin shell (§C.3).
name = "chekov"
path = "src/lib.rs"

[[bin]]
name = "chekov"
path = "src/main.rs"

[dependencies]
# CLI tree via derive — the command pattern's declarative half (prompt §2.2).
clap = { version = "4.6", features = ["derive"] }
# Completions generated by the hidden `chekov completions` subcommand at
# install time (build.rs cannot see the crate's own CLI without a cycle).
clap_complete = "4.6"
# §C.7: every externally-read struct is serde with deny_unknown_fields.
serde = { version = "1", features = ["derive"] }
# Registry (models.toml) and global config are TOML — §E.2 forbids YAML config.
toml = "1.1"
# serde_json is not in the prompt's crate list; justified here (§2.1): the
# HF hub API and llama-server /v1 endpoints speak JSON, and hand-rolling a
# JSON parser would violate §E.5. It is already in the tree via hf-hub.
serde_json = "1"
# §C.3: typed errors with remediation text in every Display message.
thiserror = "2"
# §C.3: anyhow at the binary boundary only (src/main.rs).
anyhow = "1"
# Blocking HTTP — this tool has no need for an async runtime (prompt §2.1).
ureq = "3.4"
# Revision-aware Hugging Face downloads. default-features off to keep only
# the blocking backend (no tokio); rustls for TLS per §C.11.
hf-hub = { version = "1", default-features = false, features = ["blocking", "rustls-tls"] }
# Home-directory resolution for the default CHEKOV root.
directories = "6"
# Signals + pid liveness for server lifecycle (SIGTERM/SIGKILL escalation).
nix = { version = "0.31", features = ["signal"] }
# Status/list tables are hand-rolled (core/table helper) instead of `tabled`:
# two fixed tables do not justify a proc-macro dependency (§9, prompt allows
# "tabled or hand-rolled").

[profile.release]
# §D.7 mandated release profile. panic = "abort" means any surviving unwrap()
# is a hard process kill — which is why §C.2 is a gate, not a style rule.
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
