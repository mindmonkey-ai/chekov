name: release

# Triggered by pushing a `v*` tag that matches Cargo.toml's version.
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
# Produces a GitHub Release with an arm64 macOS tarball and publishes the
# crate to crates.io. The publish job needs the CARGO_REGISTRY_TOKEN secret
# (Settings → Secrets → Actions); it skips cleanly when the secret is absent
# so a tag never half-fails.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Tag must match Cargo.toml version
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys;print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "v${crate}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml v${crate}"; exit 1; }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo publish --locked --dry-run

  github-release:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Build arm64 release binary
        run: cargo build --locked --release --target aarch64-apple-darwin
      - name: Package tarball
        run: |
          set -euo pipefail
          out="chekov-${GITHUB_REF_NAME}-aarch64-apple-darwin"
          mkdir -p "dist/${out}/shell"
          cp target/aarch64-apple-darwin/release/chekov "dist/${out}/"
          cp LICENSE README.md config.example.toml "dist/${out}/"
          # chekov.zsh must keep its repo-relative depth: it derives CHEKOV_HOME
          # as `${${(%):-%x}:A:h:h}`, so flattening it to the tarball root
          # resolves one level too high and breaks PATH and completions.
          cp shell/chekov.zsh "dist/${out}/shell/"
          "dist/${out}/chekov" completions zsh > "dist/${out}/shell/_chekov"
          tar -C dist -czf "dist/${out}.tar.gz" "${out}"
          (cd dist && shasum -a 256 "${out}.tar.gz" > "${out}.tar.gz.sha256")
      - name: Release notes from CHANGELOG
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > dist/notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          print(match.group(1).strip() if match else f"Release {version}")
          PY
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 \
            --title "${GITHUB_REF_NAME}" --notes-file dist/notes.md

  crates-io:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      # Token scoped to this step alone: at job level it is also live during
      # checkout and the toolchain action, neither of which needs it.
      - name: Publish (skips when CARGO_REGISTRY_TOKEN is unset)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked
