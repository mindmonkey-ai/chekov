# chekov machine config (§16.11 — tunables live here, never in code).
#
# MiniMax-M2.7 UD-Q5_K_XL is ~158 GiB of weights + ~12 GiB q8_0 KV at 98304
# ctx + compute buffers ≈ ~175 GiB. The macOS system-default wired limit on
# this 256 GiB M3 Ultra is ~192 GiB (75% of RAM), so 180000 MB is the honest
# requirement — no sudo sysctl bump needed for this model.
[limits]
wired_limit_mb = 180000
