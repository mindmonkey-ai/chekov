# Probe set v0 — corpus-free deterministic cases (spec §7.2 rows 1, 2, 6).
# The content of this file is hashed into every run's prompt_set_hash: editing
# a case makes old runs incomparable BY CONSTRUCTION, which is the point.
# Counts are a seed (7 call / 2 abstention / 1 missing-function; 12
# instruction) — grow toward the spec's 30/40, never edit in place.

version = 0

# ---------------------------------------------------------------- tool_emit

[[tool_emit]]
id = "te-001"
prompt = "Show me the contents of the file src/main.rs."
expect = "call"
golden_name = "read_file"
golden_args = '{"path":"src/main.rs"}'
[[tool_emit.tools]]
name = "read_file"
description = "Read a file from the repository and return its contents."
input_schema = '{"type":"object","properties":{"path":{"type":"string","description":"Repository-relative file path"}},"required":["path"]}'

[[tool_emit]]
id = "te-002"
prompt = "Search for the pattern spawn_daemon in the directory src."
expect = "call"
golden_name = "grep"
golden_args = '{"pattern":"spawn_daemon","path":"src"}'
[[tool_emit.tools]]
name = "read_file"
description = "Read a file from the repository and return its contents."
input_schema = '{"type":"object","properties":{"path":{"type":"string"}},"required":["path"]}'
[[tool_emit.tools]]
name = "grep"
description = "Search files under a path for a pattern; returns matching lines."
input_schema = '{"type":"object","properties":{"pattern":{"type":"string"},"path":{"type":"string"}},"required":["pattern","path"]}'

[[tool_emit]]
id = "te-003"
prompt = "In the file Cargo.toml, replace the exact text version = \"0.1.0\" with version = \"0.2.0\"."
expect = "call"
golden_name = "edit_file"
golden_args = '{"path":"Cargo.toml","old":"version = \"0.1.0\"","new":"version = \"0.2.0\""}'
[[tool_emit.tools]]
name = "read_file"
description = "Read a file from the repository and return its contents."
input_schema = '{"type":"object","properties":{"path":{"type":"string"}},"required":["path"]}'
[[tool_emit.tools]]
name = "edit_file"
description = "Replace one exact text occurrence in a file."
input_schema = '{"type":"object","properties":{"path":{"type":"string"},"old":{"type":"string"},"new":{"type":"string"}},"required":["path","old","new"]}'

