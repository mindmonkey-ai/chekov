# Probe set v0 — corpus-free deterministic cases (spec §7.2 rows 1, 2, 6).
# The content of this file is hashed into every run's prompt_set_hash: editing
# a case makes old runs incomparable BY CONSTRUCTION, which is the point.
# 39 tool cases (30 calls / 9 abstentions), 40 instruction cases, 6 tool_loop.
# The original questions are preserved; the approved expansion is appended.

version = 0

# The system text every tool_loop turn carries (tool-loop design §5).
loop_system = "You are a coding agent working in a small repository through the tools provided. Read before you edit, edit with exact text, and verify with the test tool whenever it is offered. When the task is complete, or cannot be done with the tools you have, reply in plain text and stop."

