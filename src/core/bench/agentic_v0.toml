# -------------------------------------------------------------- instruction

[[instruction]]
id = "if-001"
prompt = "Write a Rust function with the exact signature fn add(a: i64, b: i64) -> i64 that returns the sum. Reply with exactly one fenced rust code block and no prose."
checks = ["fenced_rust_only", "contains:fn add", "brace_balanced"]

[[instruction]]
id = "if-002"
prompt = "Write a Rust function with the exact signature fn is_even(n: u64) -> bool. At most 6 lines in total. Reply with only a fenced rust code block."
checks = ["fenced_rust_only", "max_lines:6", "contains:fn is_even"]

[[instruction]]
id = "if-003"
prompt = "Write a Rust function with the exact signature fn parse_port(s: &str) -> Option<u16> that parses a port number, without using unwrap or expect anywhere. Reply with only a fenced rust code block."
checks = ["fenced_rust_only", "no_unwrap", "contains:fn parse_port"]

[[instruction]]
id = "if-004"
prompt = "Reply with the single word: ready"
checks = ["contains:ready", "max_lines:1", "not_contains:```"]

[[instruction]]
id = "if-005"
prompt = "Reply with valid JSON only, no code fence and no prose: an object with a key name whose value is a string, and a key port whose value is a number."
checks = ["contains:\"name\"", "contains:\"port\"", "not_contains:```"]

[[instruction]]
id = "if-006"
prompt = "Explain in one sentence what a pidfile is, without using the word process anywhere in your answer."
checks = ["not_contains:process", "max_lines:2"]

[[instruction]]
id = "if-007"
prompt = "Name the four seasons, one per line, in lowercase, and write nothing else."
checks = ["max_lines:4", "contains:winter", "contains:summer", "not_contains:```"]

[[instruction]]
id = "if-008"
prompt = "Write a Rust function with the exact signature fn max3(a: i32, b: i32, c: i32) -> i32 using std::cmp::max. Reply with exactly one fenced rust code block."
checks = ["fenced_rust_only", "contains:cmp::max", "contains:fn max3"]

[[instruction]]
id = "if-009"
prompt = "Reply with exactly this text and nothing else: chekov ready"
checks = ["contains:chekov ready", "max_lines:1", "not_contains:```"]

[[instruction]]
id = "if-010"
prompt = "Write a single Rust function named status that returns the string ok as a String. No comments anywhere in the code. Reply with only a fenced rust code block."
checks = ["fenced_rust_only", "contains:fn status", "not_contains://"]

[[instruction]]
id = "if-011"
prompt = "Reply with exactly this text on one line and nothing else: 1, 2, 3, 4, 5"
checks = ["contains:1, 2, 3, 4, 5", "max_lines:1"]

[[instruction]]
id = "if-012"
prompt = "Write a Rust function with the exact signature fn clamp01(x: f64) -> f64 that clamps x into the range 0.0 to 1.0. At most 8 lines. Reply with only a fenced rust code block."
checks = ["fenced_rust_only", "brace_balanced", "max_lines:8", "contains:fn clamp01"]
